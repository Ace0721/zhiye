[package]
name = "zhiye"
version = "0.3.1"
description = "Local-first courseware flashcards"
authors = ["Zhiye contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2.5"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
strip = true
